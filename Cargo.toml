[package]
name = "memoro"
version = "0.1.2"
edition = "2021"
description = "A personal, Git-backed memory system for AI agents."
documentation = "https://docs.rs/memoro"
repository = "https://github.com/Towano/memoro"
homepage = "https://github.com/Towano/memoro"
readme = "README.md"
license = "MIT"
keywords = ["ai", "agents", "memory", "mcp", "git"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["python/**", "data/**", "target/**", "**/__pycache__/**"]

[lib]
name = "memoro"
path = "src/lib.rs"

[[bin]]
name = "memoro"
path = "src/main.rs"

[dependencies]
git2 = {
    version = ">=0.20",
    default-features = false,
    features = ["vendored-libgit2", "ssh", "https", "vendored-openssl"],
}
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
fd-lock = "4"
regex = "1"
saphyr-parser = "0.0.12"
rmcp = { version = "=3.1.4", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
subtle = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
